spring.application.name=craving-query

# 1. PostgreSQL Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5433/craving_query
spring.datasource.username=contacts_app
spring.datasource.password=dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. JPA / Hibernate Schema Strategy
# Since you created the tables manually via SQL commands, use 'validate' 
# to make sure your Java entities match your Postgres schema perfectly.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 3. Development Logging (Prints clean SQL in your IDE console)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

